[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "talent_matcher"
authors = [
    { name = "Talent Matcher Team" }
]
description = "AI-powered resume parsing and candidate matching for Frappe and ERPNext HRMS"
readme = "README.md"
dynamic = ["version"]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pypdf>=3.9.0",
    "python-docx>=0.8.11",
    "spacy>=3.5.0",
    "scikit-learn>=1.2.0",
    "sentence-transformers>=2.2.0",
    "qdrant-client>=1.7.0"
]

[tool.flit.module]
name = "talent_matcher"
